<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polymarket Live Trades</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .trade-enter {
            animation: slideIn 0.2s ease-out;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .event-panel {
            min-height: 400px;
            max-height: 600px;
        }
        .trade-list {
            max-height: 350px;
            overflow-y: auto;
        }
        .trade-list::-webkit-scrollbar {
            width: 6px;
        }
        .trade-list::-webkit-scrollbar-track {
            background: #1f2937;
        }
        .trade-list::-webkit-scrollbar-thumb {
            background: #4b5563;
            border-radius: 3px;
        }
        .live-pulse {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .score-box {
            background: linear-gradient(135deg, #1e3a5f 0%, #1a1a2e 100%);
        }
        .score-flash {
            animation: scoreFlash 0.6s ease-out;
        }
        @keyframes scoreFlash {
            0% { transform: scale(1); color: white; }
            30% { transform: scale(1.3); color: #fbbf24; text-shadow: 0 0 20px #fbbf24; }
            100% { transform: scale(1); color: white; text-shadow: none; }
        }
        .score-delta {
            position: absolute;
            top: -8px;
            right: -20px;
            font-size: 12px;
            font-weight: bold;
            color: #4ade80;
            animation: deltaFade 1.5s ease-out forwards;
        }
        @keyframes deltaFade {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-10px); }
        }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen">
    <div class="container mx-auto px-4 py-6">
        <!-- Header -->
        <div class="flex items-center justify-between mb-6">
            <div>
                <h1 class="text-2xl font-bold">Polymarket Live Trades</h1>
                <p class="text-gray-400 text-sm">Pro Trader View - Multi-Event Monitoring</p>
            </div>
            <div class="flex items-center gap-4">
                <!-- Auth Section -->
                <div id="authSection" class="flex items-center gap-2">
                    <div id="loggedOutUI" class="flex items-center gap-2">
                        <button onclick="initiateLogin()" id="loginBtn"
                                class="px-3 py-1.5 bg-purple-600 hover:bg-purple-700 rounded text-sm font-medium transition-colors flex items-center gap-1">
                            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>
                            </svg>
                            Login
                        </button>
                    </div>
                    <div id="loggedInUI" class="hidden flex items-center gap-2">
                        <span id="walletDisplay" class="text-gray-400 text-xs font-mono"></span>
                        <button onclick="logout()"
                                class="px-2 py-1 bg-gray-700 hover:bg-gray-600 rounded text-xs font-medium transition-colors">
                            Logout
                        </button>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <div id="statusDot" class="w-2.5 h-2.5 rounded-full bg-gray-500"></div>
                    <span id="status" class="text-gray-400 text-sm">Not connected</span>
                </div>
                <div class="flex items-center gap-2">
                    <div id="sportsStatusDot" class="w-2.5 h-2.5 rounded-full bg-gray-500"></div>
                    <span id="sportsStatus" class="text-gray-400 text-sm">Sports: Off</span>
                </div>
                <button onclick="toggleConnection()" id="connectBtn"
                        class="px-4 py-1.5 bg-blue-600 hover:bg-blue-700 rounded text-sm font-medium transition-colors">
                    Connect
                </button>
            </div>
        </div>

        <!-- Add Event Bar -->
        <div id="addEventSection" class="hidden mb-6">
            <div class="flex gap-2 items-center">
                <input type="text" id="eventSlug"
                       placeholder="Enter event slug (e.g., nba-lal-por-2026-01-17)"
                       class="flex-1 px-4 py-2 rounded bg-gray-800 border border-gray-700 focus:outline-none focus:border-blue-500 text-white placeholder-gray-500 text-sm">
                <label class="flex items-center gap-2 text-sm text-gray-400 cursor-pointer">
                    <input type="checkbox" id="allMarketsToggle" class="w-4 h-4 rounded bg-gray-700 border-gray-600">
                    <span>All Markets</span>
                </label>
                <button onclick="subscribeEvent()"
                        class="px-4 py-2 bg-green-600 hover:bg-green-700 rounded text-sm font-medium transition-colors">
                    Add Event
                </button>
            </div>
        </div>

        <!-- My Watches (durable Live Watches, distinct from the ephemeral
             viewing panels below) -->
        <div id="watchesSection" class="hidden mb-6">
            <div class="flex items-center justify-between mb-2">
                <h2 class="text-lg font-semibold">My Watches</h2>
                <span class="text-gray-500 text-xs">Durable subscriptions — snipe alerts, optional tape feed</span>
            </div>
            <div id="watchesList" class="space-y-1"></div>
        </div>

        <!-- Event Panels Grid -->
        <div id="eventPanels" class="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-4">
            <!-- Placeholder when no events -->
            <div id="noEventsPlaceholder" class="col-span-full bg-gray-800 rounded-lg p-12 text-center">
                <div class="text-gray-500 text-lg mb-2">No events subscribed</div>
                <div class="text-gray-600 text-sm">Connect and add events to start monitoring trades</div>
            </div>
        </div>

        <!-- Footer -->
        <div class="mt-6 text-center text-gray-600 text-xs">
            Powered by Polymarket RTDS & Sports WebSocket
        </div>
    </div>

    <script>
        // Trade WebSocket
        let ws = null;
        let subscriptions = new Map(); // eventSlug -> { title, trades: [], buys: 0, sells: 0, allMarkets: bool }
        let reconnectTimer = null;
        let manualDisconnect = false;
        const RECONNECT_DELAY = 3000;
        const STORAGE_KEY = 'polymarket_live_subscriptions';

        // Sports WebSocket
        let sportsWs = null;
        let sportsReconnectTimer = null;
        let sportsReconnectDelay = 1000; // Start with 1 second, exponential backoff
        let gameStates = new Map(); // gameId -> game data
        let eventToGameId = new Map(); // eventSlug -> gameId
        let eventGameData = new Map(); // eventSlug -> { homeTeam, awayTeam } - full names
        let previousScores = new Map(); // eventSlug -> { home: string, away: string }

        // US leagues use away-home format in slug
        // Include both common abbreviations (cbb/cfb) and full forms (ncaab/ncaaf)
        const US_LEAGUES = ['nba', 'nfl', 'mlb', 'nhl', 'ncaab', 'ncaaf', 'wnba', 'cbb', 'cfb', 'mls'];

        // Load saved subscriptions from localStorage
        function loadSavedSubscriptions() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    return JSON.parse(saved);
                }
            } catch (e) {
                console.error('Failed to load saved subscriptions:', e);
            }
            return [];
        }

        // Save subscriptions to localStorage
        function saveSubscriptions() {
            try {
                const toSave = [];
                subscriptions.forEach((data, slug) => {
                    toSave.push({ slug, allMarkets: data.allMarkets || false });
                });
                localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
            } catch (e) {
                console.error('Failed to save subscriptions:', e);
            }
        }

        // Re-subscribe to all saved events
        function resubscribeAll() {
            const saved = loadSavedSubscriptions();
            saved.forEach(({ slug, allMarkets }) => {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    console.log('Re-subscribing to:', slug);
                    ws.send(JSON.stringify({ action: 'subscribe', event: slug, allMarkets: allMarkets }));
                }
            });
        }

        // ==================== Sports WebSocket ====================

        function connectSportsWs() {
            if (sportsWs && sportsWs.readyState === WebSocket.OPEN) return;

            // Clear any existing reconnect timer
            if (sportsReconnectTimer) {
                clearTimeout(sportsReconnectTimer);
                sportsReconnectTimer = null;
            }

            console.log('Connecting to Sports WebSocket...');
            setSportsStatus('connecting', 'Sports: Connecting...');

            sportsWs = new WebSocket('wss://sports-api.polymarket.com/ws');

            sportsWs.onopen = () => {
                console.log('Sports WebSocket connected');
                setSportsStatus('connected', 'Sports: Live');
                // Reset reconnect delay on successful connection
                sportsReconnectDelay = 1000;
            };

            sportsWs.onmessage = (event) => {
                // CRITICAL: Handle ping/pong first (lowercase!)
                // Server sends 'ping' every 5 seconds, must respond with 'pong' within 10 seconds
                if (event.data === 'ping') {
                    if (sportsWs && sportsWs.readyState === WebSocket.OPEN) {
                        sportsWs.send('pong');
                    }
                    return;
                }

                // Try to parse JSON for game data
                try {
                    const data = JSON.parse(event.data);
                    handleSportsMessage(data);
                } catch (e) {
                    // Ignore non-JSON messages
                    console.log('Sports WS non-JSON message:', event.data);
                }
            };

            sportsWs.onclose = (e) => {
                console.log('Sports WebSocket disconnected:', e.code, e.reason);
                setSportsStatus('disconnected', 'Sports: Off');

                // Auto-reconnect with exponential backoff (max 30 seconds)
                sportsReconnectTimer = setTimeout(() => {
                    connectSportsWs();
                }, sportsReconnectDelay);
                sportsReconnectDelay = Math.min(sportsReconnectDelay * 2, 30000);
            };

            sportsWs.onerror = (err) => {
                console.error('Sports WebSocket error:', err);
                setSportsStatus('error', 'Sports: Error');
            };
        }

        function disconnectSportsWs() {
            if (sportsReconnectTimer) {
                clearTimeout(sportsReconnectTimer);
                sportsReconnectTimer = null;
            }
            if (sportsWs) {
                sportsWs.close();
                sportsWs = null;
            }
        }

        function handleSportsMessage(data) {
            // Sports WebSocket sends game state updates
            if (!data.gameId) return;

            const gameId = data.gameId;
            gameStates.set(gameId, data);

            // Try to match this game to subscribed events
            subscriptions.forEach((eventData, slug) => {
                if (matchEventToGame(slug, data)) {
                    eventToGameId.set(slug, gameId);

                    // Prefer full team names from title, fallback to Sports WS data
                    const titleTeams = getTeamsFromTitle(slug, eventData.title);
                    if (titleTeams) {
                        eventGameData.set(slug, {
                            homeTeam: titleTeams.home,
                            awayTeam: titleTeams.away
                        });
                    } else {
                        // Fallback to Sports WS data (might be abbreviations)
                        eventGameData.set(slug, {
                            homeTeam: data.homeTeam,
                            awayTeam: data.awayTeam
                        });
                    }
                    updateGameStateUI(slug, data);
                }
            });
        }

        function matchEventToGame(eventSlug, gameData) {
            const parts = eventSlug.toLowerCase().split('-');
            if (parts.length < 4) return false;

            const league = parts[0];
            const gameLeague = (gameData.leagueAbbreviation || '').toLowerCase();

            // League must match
            if (league !== gameLeague) return false;

            const slugTeam1 = parts[1].toUpperCase();
            const slugTeam2 = parts[2].toUpperCase();
            const gameHome = (gameData.homeTeam || '').toUpperCase();
            const gameAway = (gameData.awayTeam || '').toUpperCase();

            // Get subscription data for title-based matching
            const subData = subscriptions.get(eventSlug);
            const eventTitle = subData?.title || '';

            console.log(`[Match] Slug: ${eventSlug}, League: ${league}/${gameLeague}`);
            console.log(`[Match] Slug teams: ${slugTeam1}, ${slugTeam2}`);
            console.log(`[Match] Game teams: away=${gameAway}, home=${gameHome}`);
            console.log(`[Match] Title: "${eventTitle}"`);

            // Method 1: Direct slug abbreviation matching (most reliable for abbreviated names)
            // Sports WS often uses same abbreviations as Polymarket slugs (UMASS, TOLEDO, etc.)
            const isUSLeague = US_LEAGUES.includes(league);
            if (isUSLeague) {
                // US: slug is away-home format
                const awayMatch = fuzzyTeamMatch(slugTeam1, gameAway);
                const homeMatch = fuzzyTeamMatch(slugTeam2, gameHome);
                console.log(`[Match] Slug match (US): ${slugTeam1}↔${gameAway}=${awayMatch}, ${slugTeam2}↔${gameHome}=${homeMatch}`);
                if (awayMatch && homeMatch) {
                    console.log(`[Match] ✓ MATCHED via slug!`);
                    return true;
                }
            } else {
                // Non-US: slug is home-away format
                const homeMatch = fuzzyTeamMatch(slugTeam1, gameHome);
                const awayMatch = fuzzyTeamMatch(slugTeam2, gameAway);
                console.log(`[Match] Slug match (non-US): ${slugTeam1}↔${gameHome}=${homeMatch}, ${slugTeam2}↔${gameAway}=${awayMatch}`);
                if (homeMatch && awayMatch) {
                    console.log(`[Match] ✓ MATCHED via slug!`);
                    return true;
                }
            }

            // Method 2: Title-based matching (for cases where Sports WS uses different names)
            if (eventTitle && gameHome && gameAway) {
                const titleNorm = normalizeText(eventTitle.toUpperCase());
                const homeNorm = normalizeText(gameHome);
                const awayNorm = normalizeText(gameAway);

                const homeInTitle = titleNorm.includes(homeNorm) || fuzzyTeamMatch(homeNorm, titleNorm);
                const awayInTitle = titleNorm.includes(awayNorm) || fuzzyTeamMatch(awayNorm, titleNorm);

                console.log(`[Match] Title match: ${homeNorm}→${homeInTitle}, ${awayNorm}→${awayInTitle}`);

                if (homeInTitle && awayInTitle) {
                    console.log(`[Match] ✓ MATCHED via title!`);
                    return true;
                }
            }

            console.log(`[Match] ✗ No match found`);
            return false;
        }

        // Normalize special characters for matching (ø→o, ü→u, é→e, etc.)
        function normalizeText(text) {
            return text
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '') // Remove diacritics
                .replace(/ø/gi, 'o')
                .replace(/æ/gi, 'ae')
                .replace(/ß/g, 'ss')
                .replace(/[\/\-_\.]/g, ' ')      // Replace separators with space
                .replace(/[^a-zA-Z0-9\s]/g, '')  // Remove other special chars
                .replace(/\s+/g, ' ')            // Collapse multiple spaces
                .trim();
        }

        // Fuzzy match team abbreviation to full team name
        // e.g., "NOLOGO" matches "NOLOGOJUSTMMR", "LYNX" matches "TEAM LYNX"
        // e.g., "SPIRIT1" matches "SPIRIT ACADEMY" (trailing numbers stripped)
        // e.g., "RE" matches "RUNE EATERS" (initials)
        // e.g., "BOG" matches "FK Bodø/Glimt" (normalized ø→o)
        function fuzzyTeamMatch(slugTeam, gameTeam) {
            if (!slugTeam || !gameTeam) return false;

            // Normalize both teams for comparison
            const slugNorm = normalizeText(slugTeam);
            const gameNorm = normalizeText(gameTeam);

            // Strip trailing numbers from slug team (e.g., "SPIRIT1" -> "SPIRIT")
            const slugTeamClean = slugNorm.replace(/\d+$/, '');

            // Try matching with both original and cleaned slug team
            const candidates = [slugNorm];
            if (slugTeamClean !== slugNorm && slugTeamClean.length > 0) {
                candidates.push(slugTeamClean);
            }

            const gameTeamNoSpaces = gameNorm.replace(/\s+/g, '');
            const words = gameNorm.split(/\s+/).filter(w => w.length > 0);

            for (const candidate of candidates) {
                // Exact match
                if (candidate === gameNorm) return true;

                // Slug team is contained in game team (handles "LYNX" in "TEAM LYNX")
                if (gameNorm.includes(candidate)) return true;

                // Game team starts with slug team (handles "NOLOGO" -> "NOLOGOJUSTMMR")
                if (gameNorm.startsWith(candidate)) return true;

                // Remove spaces and check (handles "SPIRIT" in "SPIRITACADEMY")
                if (gameTeamNoSpaces.includes(candidate)) return true;

                // Check if any word in game team starts with slug team
                for (const word of words) {
                    if (word.startsWith(candidate)) return true;
                }

                // Check if slug is initials of game team words
                // "RE" matches "Rune Eaters" (R + E)
                if (words.length >= 2 && candidate.length >= 2) {
                    const initials = words.map(w => w[0]).join('');
                    if (initials === candidate) return true;
                    // Also check first N letters match initials
                    if (initials.startsWith(candidate) || candidate.startsWith(initials)) return true;
                }

                // Check if slug chars appear as subsequence across all words
                // "MNC" matches "MaNChester CITY" (M...N...C in order)
                if (candidate.length >= 2) {
                    if (isSubsequence(candidate, gameTeamNoSpaces)) {
                        return true;
                    }
                }

                // For short abbreviations (3-4 chars), match if first 2 chars are same
                // This handles PHX vs PHO (both Phoenix), LAL vs LAK, etc.
                if (candidate.length <= 4 && gameNorm.length <= 4) {
                    if (candidate.substring(0, 2) === gameNorm.substring(0, 2)) {
                        return true;
                    }
                }
            }

            return false;
        }

        // Check if 'sub' appears as subsequence in 'str'
        // e.g., "MNC" in "MANCHESTER" → M(a)N(chester)C(ity)... wait that's across words
        // Better: check if chars appear in order
        function isSubsequence(sub, str) {
            let subIdx = 0;
            for (let i = 0; i < str.length && subIdx < sub.length; i++) {
                if (str[i] === sub[subIdx]) {
                    subIdx++;
                }
            }
            return subIdx === sub.length;
        }

        function setSportsStatus(state, text) {
            const statusDot = document.getElementById('sportsStatusDot');
            const statusText = document.getElementById('sportsStatus');
            statusText.textContent = text;

            const colors = {
                connected: 'bg-green-500',
                connecting: 'bg-yellow-500 animate-pulse',
                disconnected: 'bg-gray-500',
                error: 'bg-red-500'
            };

            statusDot.className = `w-2.5 h-2.5 rounded-full ${colors[state]}`;
        }

        // The game number a panel is pinned to, from the pinned market slug
        // ("…-game4" → 4). Null for unpinned panels or non-game pins.
        function getPinnedGameNumber(eventSlug) {
            const market = subscriptions.get(eventSlug)?.market;
            const m = market && market.match(/-game(\d+)$/);
            return m ? parseInt(m[1], 10) : null;
        }

        // The game currently being played, from the series period ("3/5" → 3).
        function parseCurrentGame(period) {
            const m = (period || '').match(/^(\d+)\/\d+/);
            return m ? parseInt(m[1], 10) : null;
        }

        function updateGameStateUI(eventSlug, gameData) {
            const gamePanel = document.getElementById(`game-${eventSlug}`);
            if (!gamePanel) return;

            const isLive = gameData.live && !gameData.ended;
            const score = gameData.score || '0-0';
            const period = gameData.period || '';
            const elapsed = gameData.elapsed || '';
            const possession = gameData.turn || '';

            // Determine if US league for display order
            const parts = eventSlug.toLowerCase().split('-');
            const league = parts[0] || '';
            const isUSLeague = US_LEAGUES.includes(league);

            // Parse score - format depends on league convention
            // US sports WebSocket: "awayScore-homeScore" (e.g., 38-36 means away=38, home=36)
            // Soccer/Other: "homeScore-awayScore"
            const [score1, score2] = parseScore(score, eventSlug);
            const homeScore = isUSLeague ? score2 : score1;
            const awayScore = isUSLeague ? score1 : score2;

            // For display: US leagues show Away @ Home, others show Home vs Away
            const leftScore = isUSLeague ? awayScore : homeScore;
            const rightScore = isUSLeague ? homeScore : awayScore;

            // Get previous scores for change detection
            const prevScores = previousScores.get(eventSlug) || { left: '0', right: '0' };
            const leftChanged = prevScores.left !== leftScore && prevScores.left !== '0';
            const rightChanged = prevScores.right !== rightScore && prevScores.right !== '0';

            // Store current scores for next comparison
            previousScores.set(eventSlug, { left: leftScore, right: rightScore });

            // Update live indicator. The sports feed carries ONE state per
            // series (period "3/5" = game 3 of 5 running), so a panel pinned
            // to a specific game must not claim LIVE while a different game
            // of the series is the one being played.
            const liveIndicator = gamePanel.querySelector('.live-indicator');
            if (liveIndicator) {
                const pinnedGame = getPinnedGameNumber(eventSlug);
                const currentGame = parseCurrentGame(period);
                if (gameData.ended) {
                    liveIndicator.innerHTML = '<span class="text-gray-400 text-xs">FINAL</span>';
                } else if (isLive && pinnedGame && currentGame && pinnedGame > currentGame) {
                    liveIndicator.innerHTML = `<span class="text-gray-500 text-xs">UPCOMING · GAME ${pinnedGame}</span>`;
                } else if (isLive && pinnedGame && currentGame && pinnedGame < currentGame) {
                    liveIndicator.innerHTML = `<span class="text-gray-400 text-xs">GAME ${pinnedGame} ENDED</span>`;
                } else if (isLive) {
                    const suffix = pinnedGame && currentGame === pinnedGame ? ` · GAME ${pinnedGame}` : '';
                    liveIndicator.innerHTML = `<span class="live-pulse text-red-500 font-bold text-xs">● LIVE${suffix}</span>`;
                } else {
                    liveIndicator.innerHTML = '<span class="text-gray-500 text-xs">UPCOMING</span>';
                }
            }

            // Update team names (prefer stored full names over Sports WS abbreviations)
            const storedTeams = eventGameData.get(eventSlug);
            const leftTeamEl = gamePanel.querySelector('.left-team');
            const rightTeamEl = gamePanel.querySelector('.right-team');

            if (storedTeams) {
                const leftTeamName = isUSLeague ? storedTeams.awayTeam : storedTeams.homeTeam;
                const rightTeamName = isUSLeague ? storedTeams.homeTeam : storedTeams.awayTeam;

                if (leftTeamEl && leftTeamName) {
                    leftTeamEl.textContent = leftTeamName;
                    leftTeamEl.title = leftTeamName;
                }
                if (rightTeamEl && rightTeamName) {
                    rightTeamEl.textContent = rightTeamName;
                    rightTeamEl.title = rightTeamName;
                }
            }

            // Update scores with flash animation on change
            const leftScoreEl = gamePanel.querySelector('.left-score');
            const rightScoreEl = gamePanel.querySelector('.right-score');

            if (leftScoreEl) {
                leftScoreEl.textContent = leftScore;
                if (leftChanged) {
                    triggerScoreFlash(leftScoreEl, parseInt(leftScore) - parseInt(prevScores.left));
                }
            }
            if (rightScoreEl) {
                rightScoreEl.textContent = rightScore;
                if (rightChanged) {
                    triggerScoreFlash(rightScoreEl, parseInt(rightScore) - parseInt(prevScores.right));
                }
            }

            // Update period/time
            const periodEl = gamePanel.querySelector('.game-period');
            if (periodEl) {
                let periodText = period;
                if (elapsed) periodText += ` ${elapsed}`;
                periodEl.textContent = periodText;
            }

            // Update possession indicator (for NFL/CFB)
            const leftPoss = gamePanel.querySelector('.left-possession');
            const rightPoss = gamePanel.querySelector('.right-possession');
            if (leftPoss && rightPoss && possession) {
                // Possession is typically team abbreviation like "lac", "buf"
                const possUpper = possession.toUpperCase();
                const homeTeamUpper = (gameData.homeTeam || '').toUpperCase();
                const awayTeamUpper = (gameData.awayTeam || '').toUpperCase();

                const isHomePoss = homeTeamUpper.startsWith(possUpper) ||
                                   homeTeamUpper.includes(possUpper);
                const isAwayPoss = awayTeamUpper.startsWith(possUpper) ||
                                   awayTeamUpper.includes(possUpper);

                // For US leagues: left=away, right=home
                // For others: left=home, right=away
                const isLeftPoss = isUSLeague ? isAwayPoss : isHomePoss;
                const isRightPoss = isUSLeague ? isHomePoss : isAwayPoss;

                leftPoss.classList.toggle('opacity-100', isLeftPoss);
                leftPoss.classList.toggle('opacity-0', !isLeftPoss);
                rightPoss.classList.toggle('opacity-100', isRightPoss);
                rightPoss.classList.toggle('opacity-0', !isRightPoss);
            }

            // Show the game panel if it was hidden
            gamePanel.classList.remove('hidden');
        }

        // Trigger score flash animation and show delta
        function triggerScoreFlash(scoreEl, delta) {
            // Add flash animation
            scoreEl.classList.remove('score-flash');
            // Force reflow to restart animation
            void scoreEl.offsetWidth;
            scoreEl.classList.add('score-flash');

            // Show delta indicator if positive
            if (delta > 0) {
                // Remove existing delta if any
                const existingDelta = scoreEl.parentElement.querySelector('.score-delta');
                if (existingDelta) existingDelta.remove();

                const deltaEl = document.createElement('span');
                deltaEl.className = 'score-delta';
                deltaEl.textContent = `+${delta}`;
                scoreEl.parentElement.style.position = 'relative';
                scoreEl.parentElement.appendChild(deltaEl);

                // Remove delta after animation
                setTimeout(() => deltaEl.remove(), 1500);
            }

            // Remove flash class after animation
            setTimeout(() => scoreEl.classList.remove('score-flash'), 600);
        }

        function parseScore(score, eventSlug) {
            if (!score) return ['0', '0'];

            // Esports format: "000-000|2-1|Bo3" - series score is middle part
            if (score.includes('|')) {
                const segments = score.split('|');
                // Find the segment that looks like a series score (e.g., "2-1")
                for (const seg of segments) {
                    if (seg.match(/^\d+-\d+$/) && !seg.match(/^0+-0+$/)) {
                        const parts = seg.split('-');
                        return [parts[0].trim(), parts[1].trim()];
                    }
                }
                // Fallback to second segment if exists
                if (segments.length >= 2) {
                    const parts = segments[1].split('-');
                    if (parts.length === 2) {
                        return [parts[0].trim(), parts[1].trim()];
                    }
                }
            }

            // Standard format: "homeScore-awayScore" (e.g., "102-98")
            const parts = score.split('-');
            if (parts.length === 2) {
                return [parts[0].trim(), parts[1].trim()];
            }

            return ['0', '0'];
        }

        function getTeamsFromSlug(eventSlug) {
            const parts = eventSlug.toLowerCase().split('-');
            if (parts.length < 3) return { home: '???', away: '???' };

            const league = parts[0];
            const team1 = parts[1].toUpperCase();
            const team2 = parts[2].toUpperCase();

            if (US_LEAGUES.includes(league)) {
                return { home: team2, away: team1 };
            }
            return { home: team1, away: team2 };
        }

        // Parse team names from event title
        // e.g., "Philadelphia 76ers vs Phoenix Suns" → { team1: "Philadelphia 76ers", team2: "Phoenix Suns" }
        // e.g., "FK Bodø/Glimt vs. Manchester City FC" → { team1: "FK Bodø/Glimt", team2: "Manchester City FC" }
        function parseTeamsFromTitle(title) {
            if (!title) return null;

            // Try different separators
            const separators = [' vs. ', ' vs ', ' v. ', ' v ', ' - '];
            for (const sep of separators) {
                const idx = title.toLowerCase().indexOf(sep.toLowerCase());
                if (idx > 0) {
                    const team1 = title.substring(0, idx).trim();
                    const team2 = title.substring(idx + sep.length).trim();
                    // Remove common suffixes like "(BO3)", "- ESL One...", etc.
                    const cleanTeam2 = team2.split(/\s*[\(\-\|]/)[0].trim();
                    if (team1 && cleanTeam2) {
                        return { team1, team2: cleanTeam2 };
                    }
                }
            }
            return null;
        }

        // Determine home/away from title based on league convention
        function getTeamsFromTitle(eventSlug, title) {
            const parsed = parseTeamsFromTitle(title);
            if (!parsed) return null;

            const parts = eventSlug.toLowerCase().split('-');
            const league = parts[0] || '';

            // US sports: title is "Away @ Home" or "Away vs Home" (away first)
            // Soccer/Esports: title is "Home vs Away" (home first)
            if (US_LEAGUES.includes(league)) {
                return { home: parsed.team2, away: parsed.team1 };
            }
            return { home: parsed.team1, away: parsed.team2 };
        }

        // ==================== Trade WebSocket ====================

        function toggleConnection() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                manualDisconnect = true;
                disconnect();
            } else {
                manualDisconnect = false;
                connect();
            }
        }

        function connect() {
            if (reconnectTimer) {
                clearTimeout(reconnectTimer);
                reconnectTimer = null;
            }

            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws`;

            setStatus('connecting', 'Connecting...');

            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                setStatus('connected', 'Connected');
                document.getElementById('connectBtn').textContent = 'Disconnect';
                document.getElementById('connectBtn').classList.remove('bg-blue-600', 'hover:bg-blue-700');
                document.getElementById('connectBtn').classList.add('bg-red-600', 'hover:bg-red-700');
                document.getElementById('addEventSection').classList.remove('hidden');

                // Connect to sports WebSocket
                connectSportsWs();

                // Re-subscribe to saved events
                resubscribeAll();
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    handleMessage(data);
                } catch (e) {
                    console.error('Failed to parse message:', e);
                }
            };

            ws.onclose = () => {
                setStatus('disconnected', 'Disconnected');
                document.getElementById('connectBtn').textContent = 'Connect';
                document.getElementById('connectBtn').classList.remove('bg-red-600', 'hover:bg-red-700');
                document.getElementById('connectBtn').classList.add('bg-blue-600', 'hover:bg-blue-700');
                document.getElementById('addEventSection').classList.add('hidden');

                // Auto-reconnect unless manually disconnected
                if (!manualDisconnect) {
                    setStatus('disconnected', 'Reconnecting...');
                    reconnectTimer = setTimeout(() => {
                        console.log('Auto-reconnecting...');
                        connect();
                    }, RECONNECT_DELAY);
                }
            };

            ws.onerror = (err) => {
                console.error('WebSocket error:', err);
                setStatus('error', 'Error');
            };
        }

        function disconnect() {
            if (reconnectTimer) {
                clearTimeout(reconnectTimer);
                reconnectTimer = null;
            }
            if (ws) {
                ws.close();
                ws = null;
            }
        }

        function handleMessage(data) {
            switch (data.type) {
                case 'subscribed':
                    const existing = subscriptions.get(data.event);
                    const savedSubs = loadSavedSubscriptions();
                    const savedItem = savedSubs.find(s => s.slug === data.event);
                    const allMarkets = existing?.allMarkets || savedItem?.allMarkets || false;

                    subscriptions.set(data.event, {
                        title: data.title || data.event,
                        trades: existing?.trades || [],
                        buys: existing?.buys || 0,
                        sells: existing?.sells || 0,
                        allMarkets: allMarkets,
                        outcomes: data.outcomes || existing?.outcomes || null, // Store outcome names
                        // Pinned sub-market: set when the subscribe slug named a
                        // specific market — primary buy buttons target it
                        market: data.market || null,
                        marketQuestion: data.marketQuestion || null
                    });
                    saveSubscriptions();
                    renderPanels();

                    // Try to match with existing game states
                    gameStates.forEach((gameData, gameId) => {
                        if (matchEventToGame(data.event, gameData)) {
                            eventToGameId.set(data.event, gameId);
                            setTimeout(() => updateGameStateUI(data.event, gameData), 100);
                        }
                    });
                    break;

                case 'unsubscribed':
                    subscriptions.delete(data.event);
                    eventToGameId.delete(data.event);
                    saveSubscriptions();
                    renderPanels();
                    break;

                case 'subscriptions':
                    if (data.events) {
                        data.events.forEach(event => {
                            if (!subscriptions.has(event)) {
                                subscriptions.set(event, { title: event, trades: [], buys: 0, sells: 0 });
                            }
                        });
                    }
                    renderPanels();
                    break;

                case 'error':
                    console.error(data.message);
                    alert('Error: ' + data.message);
                    break;

                default:
                    if (data.trader && data.side) {
                        addTrade(data);
                    }
            }
        }

        function subscribeEvent() {
            const input = document.getElementById('eventSlug');
            const allMarketsToggle = document.getElementById('allMarketsToggle');
            const eventSlug = input.value.trim();
            const allMarkets = allMarketsToggle.checked;

            if (!eventSlug) {
                alert('Please enter an event slug');
                return;
            }
            if (subscriptions.has(eventSlug)) {
                alert('Already subscribed to this event');
                return;
            }

            if (ws && ws.readyState === WebSocket.OPEN) {
                console.log('Subscribing to:', eventSlug, 'allMarkets:', allMarkets);
                ws.send(JSON.stringify({ action: 'subscribe', event: eventSlug, allMarkets: allMarkets }));
                input.value = '';
            } else {
                alert('WebSocket not connected. Please reconnect.');
            }
        }

        function unsubscribeEvent(eventSlug) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ action: 'unsubscribe', event: eventSlug }));
            }
        }

        function setStatus(state, text) {
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('status');
            statusText.textContent = text;

            const colors = {
                connected: ['bg-green-500', 'text-green-400'],

            statusDot.className = `w-2.5 h-2.5 rounded-full ${colors[state][0]}`;

            const container = document.getElementById('eventPanels');

            // Determine display order based on league
            // US sports: Away @ Home (away on left, home on right)
            // Soccer/Esports: Home vs Away (home on left, away on right)
            const parts = slug.toLowerCase().split('-');

            const isWatched = liveWatches.has(slug);
            const watchBtn = getSession()?.telegramId ? `

        function formatTimeUTC8(timestamp) {
            let date;
            if (timestamp) {
                const ts = timestamp < 10000000000 ? timestamp * 1000 : timestamp;
                date = new Date(ts);
            } else {
                date = new Date();
            }
            return date.toLocaleTimeString('en-US', {
                timeZone: 'Asia/Shanghai',
                hour12: false,
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
        }

        // Build event label from slug: outcome + game tag for esports, outcome only otherwise
        // e.g., outcome="WBG", slug="lol-lpl-wbg-ig-g1-2026-02-10" → "WBG-G1"
        // e.g., outcome="IG", slug="lol-lpl-wbg-ig-g2-2026-02-10" → "IG-G2"
        // e.g., outcome="Hawks", slug="nba-atl-ind-2026-01-31" → "Hawks"
        // e.g., outcome="Zheng", slug="wta-parks-zhen-2026-02-10" → "Zheng"
        function getEventLabel(eventSlug, outcome) {
            if (!outcome) return '';

            // Extract game identifiers (g1, g2, etc.) from slug
            if (eventSlug) {
                const parts = eventSlug.split('-');
                const dateIdx = parts.findIndex(p => /^\d{4}$/.test(p));
                const end = dateIdx > 0 ? dateIdx : parts.length;
                const gameParts = parts.slice(1, end)
                    .filter(p => /^g\d+$/i.test(p))
                    .map(p => p.toUpperCase());
                if (gameParts.length > 0) {
                    return outcome + '-' + gameParts.join('-');
                }
            }

            return outcome;
        }

        function createTradeHTML(trade) {
            const isBuy = trade.side === 'BUY';
            const sideColor = isBuy ? 'text-green-400' : 'text-red-400';
            const time = formatTimeUTC8(trade.timestamp);
            const outcomeDisplay = getEventLabel(trade.eventSlug, trade.outcome);

            const traderName = trade.trader || 'Anonymous';
            const traderLink = trade.proxyWallet ?
                `https://polymarket.com/profile/${trade.proxyWallet}?tab=activity` : '#';

            return `
                <div class="trade-enter flex items-center justify-between px-3 py-2 border-b border-gray-700/50 hover:bg-gray-700/30 text-sm">
                    <div class="flex items-center gap-2 min-w-0 flex-1">
                        <span class="text-gray-500 text-xs w-16 flex-shrink-0">${time}</span>
                        <a href="${traderLink}" target="_blank" rel="noopener"
                           class="text-yellow-400 hover:text-yellow-300 hover:underline font-medium truncate max-w-[100px]"
                           title="${traderName}">
                            ${traderName}
                        </a>
                        <span class="${sideColor} font-bold w-10 flex-shrink-0">${trade.side}</span>
                        <span class="text-gray-300 truncate">${outcomeDisplay}</span>
                    </div>
                    <div class="flex items-center gap-1 flex-shrink-0 ml-2">
                        <span class="text-blue-400 font-medium">$${parseFloat(trade.size).toFixed(2)}</span>
                        <span class="text-gray-500">@</span>
                        <span class="text-purple-400">$${parseFloat(trade.price).toFixed(2)}</span>
                    </div>
                </div>
            `;
        }

        function addTrade(trade) {
            const eventSlug = trade.eventSlug;
            if (!eventSlug || !subscriptions.has(eventSlug)) return;

            const eventData = subscriptions.get(eventSlug);
            const isBuy = trade.side === 'BUY';

            if (isBuy) eventData.buys++;
            else eventData.sells++;

            eventData.trades.unshift(trade);
            if (eventData.trades.length > 100) eventData.trades.pop();

            const totalEl = document.getElementById(`total-${eventSlug}`);
            const buysEl = document.getElementById(`buys-${eventSlug}`);
            const sellsEl = document.getElementById(`sells-${eventSlug}`);

            if (totalEl) totalEl.textContent = eventData.buys + eventData.sells;
            if (buysEl) buysEl.textContent = eventData.buys;
            if (sellsEl) sellsEl.textContent = eventData.sells;

            const tradesEl = document.getElementById(`trades-${eventSlug}`);
            if (tradesEl) {
                const waiting = tradesEl.querySelector('.text-gray-600');
                if (waiting) waiting.remove();

                const tradeEl = document.createElement('div');
                tradeEl.innerHTML = createTradeHTML(trade);
                tradesEl.insertBefore(tradeEl.firstElementChild, tradesEl.firstChild);

                while (tradesEl.children.length > 100) {
                    tradesEl.removeChild(tradesEl.lastChild);
                }
            }
        }

        // Handle Enter key
        document.getElementById('eventSlug').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') subscribeEvent();
        });

        // Reconnect when tab becomes visible
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) {
                // Tab became visible, check connections
                if (ws && ws.readyState !== WebSocket.OPEN && !manualDisconnect) {
                    console.log('Tab visible, reconnecting trade WS...');
                    connect();
                }
                if (sportsWs && sportsWs.readyState !== WebSocket.OPEN) {
                    console.log('Tab visible, reconnecting sports WS...');
                    connectSportsWs();
                }
            }
        });

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            manualDisconnect = true; // Prevent reconnect attempts
            if (reconnectTimer) clearTimeout(reconnectTimer);
            if (sportsReconnectTimer) clearTimeout(sportsReconnectTimer);
            if (ws) {
                ws.close();
                ws = null;
            }
            if (sportsWs) {
                sportsWs.close();
                sportsWs = null;
            }
        });

        // ==================== Authentication ====================

        const AUTH_STORAGE_KEY = 'polymarket_live_auth';
        let loginPollingTimer = null;
        let currentLoginToken = null;

        // Get current session from localStorage
        function getSession() {
            try {
                const saved = localStorage.getItem(AUTH_STORAGE_KEY);
                if (saved) {
                    return JSON.parse(saved);
                }
            } catch (e) {
                console.error('Failed to parse session:', e);
            }
            return null;
        }

        // Track selected 3-way market
        let selected3WayMarket = { slug: null, marketIndex: null, marketLabel: null };

        // Hide all YES/NO rows
        function hideAll3WayRows() {
            document.querySelectorAll('[id^="yesno-"]').forEach(el => el.classList.add('hidden'));
            selected3WayMarket = { slug: null, marketIndex: null, marketLabel: null };
        }

        // Select a market in 3-way mode (shows YES/NO buttons)
        function select3WayMarket(eventSlug, marketIndex, marketLabel) {
            // Hide any previously shown YES/NO row
            hideAll3WayRows();

            // Store selection
            selected3WayMarket = { slug: eventSlug, marketIndex, marketLabel };

            // Show the YES/NO row for this event
            const yesnoRow = document.getElementById(`yesno-${eventSlug}`);
            const selectedLabel = document.getElementById(`selected-market-${eventSlug}`);
            if (yesnoRow && selectedLabel) {
                selectedLabel.textContent = `${marketLabel}:`;
                yesnoRow.classList.remove('hidden');
            }
        }

        // Execute trade for 3-way market (outcomeIndex: 0=Yes, 1=No within the selected market)
        async function execute3WayTrade(eventSlug, outcomeIndex) {
            if (selected3WayMarket.slug !== eventSlug || selected3WayMarket.marketIndex === null) {
                alert('Please select a market first');
                return;
            }

            await executeTrade(eventSlug, selected3WayMarket.marketIndex, outcomeIndex);
            hideAll3WayRows();
        }

        // --- Sub-market picker ---

        // Toggle the picker; fetch a fresh list on every open so markets
        // that closed as the event progressed drop out.
        async function toggleMarketPicker(eventSlug) {
            const panel = document.getElementById(`picker-${eventSlug}`);
            const toggle = document.getElementById(`picker-toggle-${eventSlug}`);
            if (!panel || !toggle) return;

            if (!panel.classList.contains('hidden')) {
                panel.classList.add('hidden');
                toggle.textContent = 'Markets ▾';
                return;
            }

            panel.classList.remove('hidden');
            toggle.textContent = 'Markets ▴';
            panel.innerHTML = '<div class="text-gray-500 text-xs px-1">Loading markets…</div>';

            try {
                const resp = await fetch(`/api/events/${encodeURIComponent(eventSlug)}/markets`);
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                const data = await resp.json();
                renderMarketPicker(eventSlug, data.markets || []);
            } catch (e) {
                console.error('Failed to load sub-markets:', e);
                panel.innerHTML = '<div class="text-red-400 text-xs px-1">Failed to load markets</div>';
            }
        }

        function renderMarketPicker(eventSlug, markets) {
            const panel = document.getElementById(`picker-${eventSlug}`);
            if (!panel) return;

            if (markets.length === 0) {
                panel.innerHTML = '<div class="text-gray-500 text-xs px-1">No open sub-markets</div>';
                return;
            }

            panel.innerHTML = markets.map(m => {
                const buttons = (m.outcomes || []).slice(0, 2).map((label, idx) => {
                    const price = formatCents(m.prices?.[idx]);
                    return `<button onclick="executeTrade('${eventSlug}', 0, ${idx}, '${m.slug}')"
                                    class="px-2 py-1 bg-blue-600 hover:bg-blue-700 rounded text-xs whitespace-nowrap transition-colors">
                                ${label}${price ? ' ' + price : ''}
                            </button>`;
                }).join('');
                const question = m.question.replace(/"/g, '&quot;');
                return `<div class="flex items-center justify-between gap-2 bg-gray-800/60 rounded px-2 py-1">
                            <span class="text-gray-300 text-xs truncate" title="${question}">${question}</span>
                            <div class="flex gap-1 shrink-0">${buttons}</div>
                        </div>`;
            }).join('');
        }

        // Indicative price → cents label ("0.55" → "55¢"). Fills still
        // price off the live order book server-side.
        function formatCents(p) {
            const n = parseFloat(p);
            return isNaN(n) ? '' : `${Math.round(n * 100)}¢`;
        }

        // Click outside handler to hide YES/NO row
        document.addEventListener('click', function(event) {
            // Check if click is outside any yesno row and not on a 3-way selector button
            const clickedYesNo = event.target.closest('[id^="yesno-"]');
            const clicked3WayBtn = event.target.closest('[onclick^="select3WayMarket"]');
            const clickedExecuteBtn = event.target.closest('[onclick^="execute3WayTrade"]');

            if (!clickedYesNo && !clicked3WayBtn && !clickedExecuteBtn && selected3WayMarket.slug) {
                hideAll3WayRows();
            }
        });

        // Execute a trade. marketIndex picks the ML market within the event
        // (always 0 for 2-way events), outcomeIndex picks the side within it.
        // Picker trades pass marketSlug instead, which targets that market
        // directly and makes marketIndex irrelevant.
        // The web UI is buy-only — selling lives in the Telegram bot.
        async function executeTrade(eventSlug, marketIndex, outcomeIndex, marketSlug = null) {
            const session = getSession();
            if (!session?.telegramId) {
                alert('Please login first');
                return;
            }

            const amountInput = document.getElementById(`amount-${eventSlug}`);
            const amount = parseFloat(amountInput?.value || 10);

            if (isNaN(amount) || amount <= 0) {
                alert('Please enter a valid amount');
                return;
            }

            // Show loading state
            const tradeSection = document.getElementById(`trade-${eventSlug}`);
            const buttons = tradeSection?.querySelectorAll('button');
            buttons?.forEach(btn => {
                btn.disabled = true;
                btn.classList.add('opacity-50');
            });

            try {
                const response = await fetch('/api/trade', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        session: {
                            telegramId: session.telegramId,
                            walletAddress: session.walletAddress,
                            proxyAddress: session.proxyAddress
                        },
                        trade: {
                            eventSlug: eventSlug,
                            marketSlug: marketSlug || undefined,
                            marketIndex: marketIndex,
                            outcomeIndex: outcomeIndex,
                            side: 'BUY',
                            amount: amount
                        }
                    })
                });

                const result = await response.json();

                if (result.success) {
                    alert(`Order placed successfully!\nOrder ID: ${result.orderId}`);
                } else {
                    alert(`Trade failed: ${result.error}`);
                }
            } catch (e) {
                console.error('Trade error:', e);
                alert(`Trade failed: ${e.message}`);
            } finally {
                // Restore buttons
                buttons?.forEach(btn => {
                    btn.disabled = false;
                    btn.classList.remove('opacity-50');
                });
            }
        }

        // Update trade sections visibility based on login state
        function updateTradeSections() {
            const isLoggedIn = !!getSession()?.telegramId;
            document.querySelectorAll('.trade-section').forEach(el => {
                el.classList.toggle('hidden', !isLoggedIn);
            });
        }

        // Check for existing session on page load
        function checkExistingSession() {
            // Check URL for token parameter (callback from Telegram)
            const urlParams = new URLSearchParams(window.location.search);
            const urlToken = urlParams.get('token');

            if (urlToken) {
                // Clear the URL parameter
                window.history.replaceState({}, document.title, window.location.pathname);
                // Complete the login
                completeLogin(urlToken);
                return;
            }

            // Check localStorage for existing session
            const saved = localStorage.getItem(AUTH_STORAGE_KEY);
            if (saved) {
                try {
                    const session = JSON.parse(saved);
                    if (session.walletAddress) {
                        showLoggedInState(session);
                    }
                } catch (e) {
                    console.error('Failed to parse saved session:', e);
                    localStorage.removeItem(AUTH_STORAGE_KEY);
                }
            }
        }

        // Initiate login by creating token and opening Telegram
        async function initiateLogin() {
            const loginBtn = document.getElementById('loginBtn');
            loginBtn.disabled = true;
            loginBtn.textContent = 'Opening...';

            try {
                const response = await fetch('/api/auth/init', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || 'Failed to initialize login');
                }

                const data = await response.json();
                currentLoginToken = data.token;

                // Open Telegram in new tab
                window.open(data.telegramUrl, '_blank');

                // Start polling for authentication
                loginBtn.textContent = 'Waiting...';
                startLoginPolling(data.token, data.expiresAt);

            } catch (e) {
                console.error('Login initialization failed:', e);
                alert('Failed to start login: ' + e.message);
                loginBtn.disabled = false;
                loginBtn.textContent = 'Login';
            }
        }

        // Poll for authentication status
        function startLoginPolling(token, expiresAt) {
            const pollInterval = 3000; // 3 seconds
            const maxPolls = Math.ceil((expiresAt * 1000 - Date.now()) / pollInterval);
            let pollCount = 0;

            loginPollingTimer = setInterval(async () => {
                pollCount++;

                // Stop if expired
                if (Date.now() > expiresAt * 1000 || pollCount > maxPolls) {
                    stopLoginPolling();
                    const loginBtn = document.getElementById('loginBtn');
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Login';
                    alert('Login session expired. Please try again.');
                    return;
                }

                try {
                    const response = await fetch(`/api/auth/status?token=${token}`);
                    if (!response.ok) {
                        console.error('Status check failed');
                        return;
                    }

                    const data = await response.json();

                    if (data.status === 'authenticated') {
                        stopLoginPolling();
                        completeLogin(token);
                    } else if (data.status === 'expired' || data.status === 'used') {
                        stopLoginPolling();
                        const loginBtn = document.getElementById('loginBtn');
                        loginBtn.disabled = false;
                        loginBtn.textContent = 'Login';
                    }
                } catch (e) {
                    console.error('Status polling error:', e);
                }
            }, pollInterval);
        }

        function stopLoginPolling() {
            if (loginPollingTimer) {
                clearInterval(loginPollingTimer);
                loginPollingTimer = null;
            }
            currentLoginToken = null;
        }

        // Complete login and save session
        async function completeLogin(token) {
            try {
                const response = await fetch('/api/auth/complete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || 'Failed to complete login');
                }

                const data = await response.json();

                if (data.success) {
                    const session = {
                        telegramId: data.telegramId,
                        walletAddress: data.walletAddress,
                        proxyAddress: data.proxyAddress,
                        authenticatedAt: Date.now()
                    };

                    localStorage.setItem(AUTH_STORAGE_KEY, JSON.stringify(session));
                    showLoggedInState(session);
                } else {
                    throw new Error(data.error || 'Login failed');
                }

            } catch (e) {
                console.error('Login completion failed:', e);
                alert('Failed to complete login: ' + e.message);
            }

            // Reset login button
            const loginBtn = document.getElementById('loginBtn');
            loginBtn.disabled = false;
            loginBtn.innerHTML = `
                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>
                </svg>
                Login
            `;
        }

        // Show logged-in UI state
        function showLoggedInState(session) {
            document.getElementById('loggedOutUI').classList.add('hidden');
            document.getElementById('loggedInUI').classList.remove('hidden');

            // Display truncated wallet address
            const walletDisplay = document.getElementById('walletDisplay');
            if (session.walletAddress) {
                const addr = session.walletAddress;
                walletDisplay.textContent = addr.slice(0, 6) + '...' + addr.slice(-4);
                walletDisplay.title = addr;
            }

            // Show trade sections
            updateTradeSections();

            // Rebuild panels so the Watch buttons appear, then hydrate the
            // durable Live Watch state from the server.
            renderPanels();
            fetchLiveWatches();
        }

        // Logout and clear session
        function logout() {
            localStorage.removeItem(AUTH_STORAGE_KEY);
            stopLoginPolling();

            document.getElementById('loggedOutUI').classList.remove('hidden');
            document.getElementById('loggedInUI').classList.add('hidden');
            document.getElementById('walletDisplay').textContent = '';

            // Hide trade sections
            updateTradeSections();

            // Drop the durable-watch view (the session that owned it is gone).
            liveWatches.clear();
            renderWatches();
            renderPanels();
        }

        // ==================== Live Watches (durable subscriptions) ====================
        // A Live Watch is a durable, server-persisted subscription (snipe watch
        // + alerts + optional tape feed), owned by the logged-in Telegram
        // identity — distinct from the ephemeral WebSocket viewing panels.
        // Managed through the session-guarded /api/events/{slug}/subscription and
        // /api/subscriptions/list endpoints (same session block as /api/trade).

        let liveWatches = new Map(); // eventSlug -> { tape: bool }

        // Build a request body carrying the current session plus any extras.
        function watchRequestBody(extra = {}) {
            const s = getSession() || {};
            return JSON.stringify({
                session: {
                    telegramId: s.telegramId,
                    walletAddress: s.walletAddress,
                    proxyAddress: s.proxyAddress
                },
                ...extra
            });
        }

        // A 401 means the session is stale/absent — fall back to the login flow.
        function handleWatchAuthError() {
            alert('Please login to manage Live Watches');
            logout();
        }

        // Load the user's durable watches and refresh the UI.
        async function fetchLiveWatches() {
            if (!getSession()?.telegramId) {
                liveWatches.clear();
                renderWatches();
                return;
            }
            try {
                const resp = await fetch('/api/subscriptions/list', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: watchRequestBody()
                });
                if (resp.status === 401) { handleWatchAuthError(); return; }
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                const items = await resp.json();
                liveWatches = new Map((items || []).map(it => [it.eventSlug, { tape: !!it.tape }]));
                renderWatches();
                refreshWatchButtons();
            } catch (e) {
                console.error('Failed to load Live Watches:', e);
            }
        }

        // Create or update (tape flip) a Live Watch via PUT.
        async function watchEvent(slug, tape = false) {
            if (!getSession()?.telegramId) { alert('Please login first'); return; }
            try {
                const resp = await fetch(`/api/events/${encodeURIComponent(slug)}/subscription`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: watchRequestBody({ tape })
                });
                if (resp.status === 401) { handleWatchAuthError(); return; }
                if (resp.status === 409) {
                    const err = await resp.json().catch(() => ({}));
                    alert(err.error || 'Watch limit reached');
                    return;
                }
                if (!resp.ok) {
                    const err = await resp.json().catch(() => ({}));
                    throw new Error(err.error || `HTTP ${resp.status}`);
                }
                const data = await resp.json();
                liveWatches.set(slug, { tape: !!data.tape });
                renderWatches();
                refreshWatchButtons();
            } catch (e) {
                console.error('Watch failed:', e);
                alert('Watch failed: ' + e.message);
            }
        }

        // Drop a Live Watch via DELETE. In-play unsubscribe guard (ADR 0008
        // decision 4, phase 4): quiet watches cost nothing to keep, and a
        // mid-game unsubscribe has burned us before (the BLG–TES drop preceded
        // the biggest favorite collapse in the ledger). Both entry points — the
        // event-panel toggle and the My Watches row button — route through here,
        // so this single confirm covers both.
        async function unwatchEvent(slug) {
            if (!getSession()?.telegramId) { alert('Please login first'); return; }
            if (!confirm('This event may still be live. Quiet watches cost nothing to keep, and unsubscribing mid-game has burned us before. Unwatch anyway?')) {
                return;
            }
            try {
                const resp = await fetch(`/api/events/${encodeURIComponent(slug)}/subscription`, {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: watchRequestBody()
                });
                if (resp.status === 401) { handleWatchAuthError(); return; }
                if (!resp.ok && resp.status !== 404) {
                    const err = await resp.json().catch(() => ({}));
                    throw new Error(err.error || `HTTP ${resp.status}`);
                }
                // 404 = already gone server-side; converge the local view either way.
                liveWatches.delete(slug);
                renderWatches();
                refreshWatchButtons();
            } catch (e) {
                console.error('Unwatch failed:', e);
                alert('Unwatch failed: ' + e.message);
            }
        }

        // Event-panel button: watch if not watched, unwatch if watched.
        function toggleWatch(slug) {
            if (liveWatches.has(slug)) {
                unwatchEvent(slug);
            } else {
                watchEvent(slug, false); // quiet by default
            }
        }

        // My Watches row: flip the tape flag with a re-PUT.
        function toggleWatchTape(slug) {
            const w = liveWatches.get(slug);
            if (!w) return;
            watchEvent(slug, !w.tape);
        }

        // Render the My Watches panel.
        function renderWatches() {
            const section = document.getElementById('watchesSection');
            const list = document.getElementById('watchesList');
            if (!section || !list) return;

            if (!getSession()?.telegramId || liveWatches.size === 0) {
                section.classList.add('hidden');
                list.innerHTML = '';
                return;
            }

            section.classList.remove('hidden');
            list.innerHTML = '';
            liveWatches.forEach((w, slug) => {
                const row = document.createElement('div');
                row.className = 'flex items-center justify-between gap-2 bg-gray-800 rounded px-3 py-2';
                row.innerHTML = `
                    <span class="text-sm text-gray-200 truncate" title="${slug}">${slug}</span>
                    <div class="flex items-center gap-2 shrink-0">
                        <button onclick="toggleWatchTape('${slug}')"
                                class="px-2 py-1 rounded text-xs font-medium transition-colors ${w.tape ? 'bg-blue-600 hover:bg-blue-700' : 'bg-gray-700 hover:bg-gray-600'}">
                            Tape ${w.tape ? 'On' : 'Off'}
                        </button>
                        <button onclick="unwatchEvent('${slug}')"
                                class="px-2 py-1 bg-gray-700 hover:bg-red-700 rounded text-xs font-medium transition-colors">
                            Unwatch
                        </button>
                    </div>
                `;
                list.appendChild(row);
            });
        }

        // Update the Watch buttons on any live event panels in place.
        function refreshWatchButtons() {
            document.querySelectorAll('[data-watch-btn]').forEach(btn => {
                const slug = btn.getAttribute('data-watch-btn');
                const watched = liveWatches.has(slug);
                btn.className = `ml-2 px-2 py-1 rounded text-xs font-medium transition-colors ${watched ? 'bg-yellow-600 hover:bg-yellow-700' : 'bg-gray-700 hover:bg-gray-600'}`;
                btn.textContent = watched ? '★ Watching' : '☆ Watch';
            });
        }

        // Check session on page load
        window.addEventListener('load', function() {
            checkExistingSession();

            const saved = loadSavedSubscriptions();
            if (saved.length > 0) {
                console.log('Found saved subscriptions, auto-connecting...');
                connect();
            }
        });
    </script>
</body>
</html>
